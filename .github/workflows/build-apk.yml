name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Using existing app/google-services.json from repository."
            exit 0
          fi
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Missing app/google-services.json and GitHub Secret GOOGLE_SERVICES_JSON is not set. Add GOOGLE_SERVICES_JSON under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os, sys

          raw = os.environ["GOOGLE_SERVICES_JSON"].strip()
          if not raw.startswith("{"):
              try:
                  raw = base64.b64decode(raw, validate=False).decode("utf-8").strip()
              except Exception as exc:
                  print(f"::error::GOOGLE_SERVICES_JSON is neither valid JSON nor valid base64: {exc}")
                  sys.exit(1)

          try:
              data = json.loads(raw)
          except Exception as exc:
              print(f"::error::Decoded GOOGLE_SERVICES_JSON is not valid JSON: {exc}")
              sys.exit(1)

          if "project_info" not in data or "client" not in data:
              print("::error::GOOGLE_SERVICES_JSON is missing required Firebase fields (project_info/client).")
              sys.exit(1)

          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("Restored app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY

      - name: Restore registered debug keystore for Google Sign-In
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 -d > "$HOME/.android/debug.keystore"
            echo "Restored debug keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > "$HOME/.android/debug.keystore"
            echo "Restored debug keystore from repository debug.keystore.base64."
          elif [ -f "debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
            echo "Restored debug keystore from repository debug.keystore."
          else
            echo "::error::Missing debug.keystore.base64 and DEBUG_KEYSTORE_BASE64 secret. Google Sign-In requires signing with the SHA-1 registered in google-services.json."
            exit 1
          fi

          SHA1_HEX=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | awk '/SHA1:/ {gsub(":", "", $2); print tolower($2)}')
          echo "Debug APK signing SHA-1: ${SHA1_HEX}"
          if ! grep -qi "${SHA1_HEX}" app/google-services.json; then
            echo "::error::Signing keystore SHA-1 (${SHA1_HEX}) is not registered in app/google-services.json. Google Sign-In would fail at runtime."
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
