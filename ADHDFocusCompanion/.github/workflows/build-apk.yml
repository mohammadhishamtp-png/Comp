name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Using existing app/google-services.json from repository."
            exit 0
          fi
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Missing app/google-services.json and GitHub Secret GOOGLE_SERVICES_JSON is not set. Add GOOGLE_SERVICES_JSON under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os, sys

          raw = os.environ["GOOGLE_SERVICES_JSON"].strip()
          if not raw.startswith("{"):
              try:
                  raw = base64.b64decode(raw, validate=False).decode("utf-8").strip()
              except Exception as exc:
                  print(f"::error::GOOGLE_SERVICES_JSON is neither valid JSON nor valid base64: {exc}")
                  sys.exit(1)

          try:
              data = json.loads(raw)
          except Exception as exc:
              print(f"::error::Decoded GOOGLE_SERVICES_JSON is not valid JSON: {exc}")
              sys.exit(1)

          if "project_info" not in data or "client" not in data:
              print("::error::GOOGLE_SERVICES_JSON is missing required Firebase fields (project_info/client).")
              sys.exit(1)

          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("Restored app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY

      - name: Restore registered debug keystore for Google Sign-In
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, shutil, sys

          android_dir = os.path.expanduser("~/.android")
          os.makedirs(android_dir, exist_ok=True)
          out_path = os.path.join(android_dir, "debug.keystore")

          def decode_b64(raw: str) -> bytes:
              cleaned = "".join(raw.split())
              pad = len(cleaned) % 4
              if pad:
                  cleaned += "=" * (4 - pad)
              return base64.b64decode(cleaned, validate=True)

          restored = False
          if os.path.isfile("debug.keystore.base64"):
              with open("debug.keystore.base64", "r", encoding="utf-8") as f:
                  data = decode_b64(f.read())
              with open(out_path, "wb") as out:
                  out.write(data)
              print("Restored debug keystore from repository debug.keystore.base64.")
              restored = True
          elif os.path.isfile("debug.keystore"):
              shutil.copyfile("debug.keystore", out_path)
              print("Restored debug keystore from repository debug.keystore.")
              restored = True
          else:
              secret_b64 = os.environ.get("DEBUG_KEYSTORE_BASE64", "")
              if secret_b64.strip():
                  try:
                      data = decode_b64(secret_b64)
                      if len(data) < 512:
                          raise ValueError("Decoded data is too small to be a valid PKCS12/JKS keystore.")
                      with open(out_path, "wb") as out:
                          out.write(data)
                      print("Restored debug keystore from DEBUG_KEYSTORE_BASE64 secret.")
                      restored = True
                  except Exception as exc:
                      print(f"::error::DEBUG_KEYSTORE_BASE64 secret is invalid ({exc}). Paste the full contents of debug.keystore.base64 or commit debug.keystore.base64 to the repo.")
                      sys.exit(1)

          if not restored:
              print("::error::Missing debug.keystore.base64 in repo and DEBUG_KEYSTORE_BASE64 secret is empty.")
              sys.exit(1)
          PY

          SHA1_HEX=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | awk '/SHA1:/ {gsub(":", "", $2); print tolower($2)}')
          echo "Debug APK signing SHA-1: ${SHA1_HEX}"
          if ! grep -qi "${SHA1_HEX}" app/google-services.json; then
            echo "::error::Signing keystore SHA-1 (${SHA1_HEX}) is not registered in app/google-services.json. Google Sign-In would fail at runtime."
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signing SHA-1 matches google-services.json
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            APK_SHA1=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/SHA-1 digest:/ {print tolower($2); exit}')
            echo "Built APK SHA-1: ${APK_SHA1}"
            if [ -n "${APK_SHA1}" ] && ! grep -qi "${APK_SHA1}" app/google-services.json; then
              echo "::error::Built APK SHA-1 (${APK_SHA1}) does not match app/google-services.json!"
              exit 1
            fi
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
